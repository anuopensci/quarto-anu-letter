title: Quarto ANU Letter
author: Emi Tanaka
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      date: today
      date-format: "DD MMMM YYYY"
    pdf: 
      documentclass: letter
      classoption: [11pt, a4paper]
      geometry:
        - "margin=1in"
        - "bottom=1in"
        - "left=1in"
        - "right=1in"
      colorlinks: true
      include-in-header:
        text: |
          \usepackage{eso-pic} % for background image
          \usepackage{graphicx} % necessary for images
          \usepackage{xifthen}
          \usepackage{parskip} % for spacing
          \usepackage{fancyhdr} % for fancy headers
          \usepackage{lastpage} 
          \usepackage[sfdefault]{roboto} % for font
          \usepackage{xcolor}
          \definecolor{anugold}{HTML}{BE830E}
          \definecolor{anugrey}{HTML}{5F6368}
          \linespread{1.1}
          \pagestyle{fancy}
          \renewcommand{\headrulewidth}{0pt}
          \fancyhead{} % footer for pages 2 on
          \lfoot{} % Left footer
          \cfoot{} % Change for center footer
          \rfoot{\footnotesize\color{anugrey} Page \thepage\ of \pageref{LastPage}} % Right footer page #s 
          \renewcommand{\footrulewidth}{0pt}
          \renewcommand{\enclname}{Enclosures}
          \AtBeginDocument{%
            \hypersetup{linkcolor=anugold, urlcolor=anugold, citecolor=anugold}%
            \setlength{\longindentation}{0pt}% left-align closing and signature
            \setlength{\indentedwidth}{\textwidth}}
          \makeatletter
          \def\anusubject{}
          % block layout: sender (right), date, recipient, subject, opening
          \renewcommand{\opening}[1]{%
            \thispagestyle{empty}%
            \ifx\@empty\fromaddress\else
              {\raggedleft\small\color{anugrey}\fromaddress\par}%
              \vspace{2\baselineskip}%
            \fi
            {\small\color{anugrey}\@date\par}%
            \vspace{\baselineskip}%
            {\raggedright\toname\\\toaddress\par}%
            \ifx\@empty\anusubject\else
              \vspace{\baselineskip}%
              {\raggedright\bfseries\anusubject\par}%
            \fi
            \vspace{\baselineskip}%
            #1\par\nobreak}
          \makeatother
      title-bg-image: assets/images/coverpage.jpg
      bg-image: assets/images/page-background.jpg
      template-partials:
        - "partials/before-body.tex"
        - "partials/after-body.tex"
        - "partials/_authors.tex"
    typst:
      papersize: a4
      margin:
        x: 1in
        y: 1in
      mainfont: Roboto
      fontsize: 11pt
      font-paths: fonts
      title-bg-image: assets/images/coverpage.jpg
      bg-image: assets/images/page-background.jpg
      template-partials:
        - "partials/typst-template.typ"
        - "partials/typst-show.typ"
